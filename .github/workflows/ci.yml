name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install bandit==1.9.4 pip-audit==2.10.1

      - name: Run tests
        run: python -m pytest tests

      - name: Scan code with Bandit
        run: bandit -r app data models --severity-level medium

      - name: Audit dependencies
        run: pip-audit -r requirements-api.txt --no-deps --disable-pip

      - name: Build Docker image
        run: docker build -t fruit-api:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fruit-api:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Publish image
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/amaan0093/fruit-shelf-life-service
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "fruit-api:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA"
          docker tag "fruit-api:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"